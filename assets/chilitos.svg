<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" preserveAspectRatio="xMidYMid meet">
  <style>
    .wordmark { font-family: 'Anton','Bebas Neue','Archivo Black','Impact',sans-serif; font-weight: 900; fill: #1A1A1A; letter-spacing: -0.005em }
    .tagline  { font-family: 'Quicksand','Comfortaa','Archivo','Inter',sans-serif; font-weight: 700; fill: #1A1A1A; letter-spacing: 0.16em }
  </style>
  <!-- Flame accent above the Í -->
  <path d="M 286,52 Q 292,28 308,40 Q 298,58 296,76 Q 288,64 286,52 Z" fill="#1A1A1A"/>
