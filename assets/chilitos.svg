  <text x="350" y="270" text-anchor="middle" font-size="240" class="wordmark">CHÍLITOS</text>
  <!-- JAMEXICAN FOOD tagline -->
  <text x="350" y="345" text-anchor="middle" font-size="34" class="tagline">JAMEXICAN FOOD</text>
